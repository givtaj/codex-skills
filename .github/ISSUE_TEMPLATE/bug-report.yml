name: Skill or plugin bug
description: Report incorrect activation, behavior, packaging, or installation.
title: "bug: "
labels:
  - bug
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin and version
      placeholder: status-review-dashboard 0.1.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Host surface
      options:
        - ChatGPT desktop app
        - ChatGPT web or mobile
        - Codex desktop app
        - Codex CLI
        - Codex IDE extension
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request and relevant context
      description: Remove private data and credentials before posting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data check
      options:
        - label: I removed secrets, private data, and personal absolute paths.
          required: true
