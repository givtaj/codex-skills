name: Skill proposal
description: Propose a focused, reusable workflow for the marketplace.
title: "proposal: "
labels:
  - enhancement
body:
  - type: input
    id: goal
    attributes:
      label: Recognizable user goal
      description: Describe the outcome, not a model, implementation, or internal codename.
    validations:
      required: true
  - type: input
    id: canonical_name
    attributes:
      label: Proposed canonical name
      placeholder: lower-case-kebab-case
      description: Use globally understandable standard or intrinsic domain terminology, not private jargon, a current task, model release, temporary UI label, codename, or implementation detail.
    validations:
      required: true
  - type: textarea
    id: global_name_review
    attributes:
      label: Global-name rationale
      description: Explain how someone outside your team or organization can infer the recognizable user goal, domain, or outcome. Explain essential brands, standards, or acronyms and note likely naming collisions.
    validations:
      required: true
  - type: textarea
    id: durability_review
    attributes:
      label: Six-month durability rationale
      description: Explain why a capable assistant six months from now can follow the core workflow if today's models, roles, tools, and UI change. Identify volatile details that belong in routed references.
    validations:
      required: true
  - type: textarea
    id: positive_requests
    attributes:
      label: Requests that should activate it
      description: Include direct, indirect, and incomplete examples.
    validations:
      required: true
  - type: textarea
    id: negative_requests
    attributes:
      label: Nearby requests that should not activate it
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and side effects
      description: List services, tools, scripts, host capabilities, writes, and permission requirements.
  - type: textarea
    id: provenance
    attributes:
      label: Provenance and redistribution permission
    validations:
      required: true
