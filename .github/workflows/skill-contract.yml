name: Skill contribution contract

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: skill-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-evidence:
    name: trusted-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CONTRIBUTION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CONTRIBUTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CONTRIBUTION_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # pull_request_target resolves this workflow and checkout from trusted main.
      # Never check out or execute the contribution in this privileged workflow.
      - name: Check out trusted main policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Mark contribution evidence pending on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "${CONTRIBUTION_HEAD_SHA}" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          case "${#CONTRIBUTION_HEAD_SHA}" in
            40|64) ;;
            *) exit 1 ;;
          esac
          curl --silent --show-error --fail-with-body --output /dev/null \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${CONTRIBUTION_HEAD_SHA}" \
            --data '{"state":"pending","context":"skill-contribution-contract","description":"Validating current skill review evidence"}'

      - name: Fetch and verify the current pull-request state
        id: current_pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "${CONTRIBUTION_PR_NUMBER}" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          current_pr_path="${RUNNER_TEMP}/current-pull-request.json"
          curl --silent --show-error --fail-with-body \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${CONTRIBUTION_PR_NUMBER}" \
            --output "${current_pr_path}"
          current_base_sha="$(jq --exit-status --raw-output '.base.sha' "${current_pr_path}")"
          current_head_sha="$(jq --exit-status --raw-output '.head.sha' "${current_pr_path}")"
          test "${current_base_sha}" = "${CONTRIBUTION_BASE_SHA}"
          test "${current_head_sha}" = "${CONTRIBUTION_HEAD_SHA}"
          test "$(git rev-parse HEAD)" = "${current_base_sha}"
          echo "event_path=${current_pr_path}" >> "${GITHUB_OUTPUT}"

      - name: Fetch contribution identity without checking it out
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin \
            "+refs/pull/${CONTRIBUTION_PR_NUMBER}/head:refs/validation/pull-head"
          test "$(git rev-parse refs/validation/pull-head)" = "${CONTRIBUTION_HEAD_SHA}"

      - name: Validate current contribution evidence with trusted policy
        run: >-
          python3 scripts/validate_skill_pr.py
          --event "${{ steps.current_pr.outputs.event_path }}"
          --base "${CONTRIBUTION_BASE_SHA}"
          --head "${CONTRIBUTION_HEAD_SHA}"

      - name: Mark contribution evidence successful on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --output /dev/null \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${CONTRIBUTION_HEAD_SHA}" \
            --data '{"state":"success","context":"skill-contribution-contract","description":"Current skill review evidence is complete"}'

      - name: Mark contribution evidence failed on the head commit
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --output /dev/null \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${CONTRIBUTION_HEAD_SHA}" \
            --data '{"state":"failure","context":"skill-contribution-contract","description":"Skill review evidence is missing or invalid"}'
