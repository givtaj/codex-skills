name: Validate marketplace

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*-v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch published refs for validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --force --prune origin \
            '+refs/*:refs/validation/origin/*' \
            '^refs/pull/*'

      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Test Central Projects Tracking
        run: python3 -m unittest discover -s plugins/central-projects-tracking/skills/central-projects-tracking/scripts -p 'test_*.py' -v

      - name: Validate marketplace
        run: python3 scripts/validate_repo.py

      - name: Validate pull-request contribution identity
        if: github.event_name == 'pull_request'
        env:
          CONTRIBUTION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTRIBUTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/validate_public_git_identity.py
          --commit-range "${CONTRIBUTION_BASE_SHA}..${CONTRIBUTION_HEAD_SHA}"
          --skip-tags

      - name: Validate published Git identity
        if: github.event_name != 'pull_request'
        run: python3 scripts/validate_public_git_identity.py
