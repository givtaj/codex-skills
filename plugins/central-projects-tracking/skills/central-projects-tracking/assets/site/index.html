<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#11171b">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="description" content="A private, evidence-based brief across an approved local project portfolio.">
    <title>Central Projects Tracking</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2311171b'/%3E%3Cpath d='M1 1h62v62H1z' fill='none' stroke='%235a8cff' stroke-width='2'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='monospace' font-size='22' font-weight='700' fill='%235a8cff'%3ECP%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/app.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to report</a>

    <header class="site-header">
      <button class="brand" type="button" data-view-target="brief" aria-label="Central Projects Tracking home">
        <span class="brand-mark" aria-hidden="true">CP</span>
        <span><strong>Central Projects Tracking</strong><small id="scope-label">Approved portfolio</small></span>
      </button>

      <nav class="primary-nav" aria-label="Tracking views">
        <button type="button" data-view-target="brief" aria-current="page"><small>01</small>Brief</button>
        <button type="button" data-view-target="portfolio"><small>02</small>Portfolio</button>
        <button type="button" data-view-target="activity"><small>03</small>Activity</button>
        <button type="button" data-view-target="system"><small>04</small>System</button>
      </nav>

      <div class="snapshot-state">
        <span class="snapshot-signal" aria-hidden="true"></span>
        <span><strong>Snapshot ready</strong><small id="snapshot-label">Validated local artifact</small></span>
      </div>
    </header>

    <main id="main-content" class="site-main" tabindex="-1"></main>

    <footer class="site-footer">
      <span>CPT / LOCAL</span>
      <p id="footer-snapshot">Evidence snapshot</p>
      <span id="footer-count">Projects under watch</span>
    </footer>

    <div id="drawer-root"></div>
    <div id="live-region" class="sr-only" role="status" aria-live="polite"></div>
    <noscript>This tracking site needs JavaScript to render its validated local snapshot.</noscript>
    <script src="data/snapshot.js" defer></script>
    <script src="assets/app.js" defer></script>
  </body>
</html>
