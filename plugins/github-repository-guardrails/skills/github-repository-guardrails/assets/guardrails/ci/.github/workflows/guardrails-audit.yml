name: Guardrail audit

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  local-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit selected guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .github/repository-guardrails.conf
          test "$(grep -Fc '<!-- github-repository-guardrails:start -->' AGENTS.md)" -eq 1
          test "$(grep -Fc '<!-- github-repository-guardrails:end -->' AGENTS.md)" -eq 1

          config=.github/repository-guardrails.conf

          read_config() {
            local key="$1"
            local matches
            local count
            matches="$(grep -E "^${key}=" "$config" || true)"
            count="$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
            if [[ "$count" != 1 ]]; then
              echo "Expected exactly one ${key} entry in ${config}" >&2
              exit 1
            fi
            printf '%s' "${matches#*=}"
          }

          unknown_keys="$({ sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$config" || true; } | cut -d= -f1 | sort -u | grep -Ev '^(schema_version|repository|project_authority|surfaces|strictness)$' || true)"
          if [[ -n "$unknown_keys" ]]; then
            echo "Unknown repository guardrail configuration key" >&2
            exit 1
          fi

          schema_version="$(read_config schema_version)"
          repository="$(read_config repository)"
          project_authority="$(read_config project_authority)"
          surfaces="$(read_config surfaces)"
          strictness="$(read_config strictness)"

          if [[ "$schema_version" != 1 || "$repository" != self ]]; then
            echo "Unsupported repository guardrail configuration version or repository selector" >&2
            exit 1
          fi
          case "$project_authority" in
            discover|disabled) ;;
            *)
              echo "Unsupported Project authority mode" >&2
              exit 1
              ;;
          esac
          case "$strictness" in
            advisory|standard|strict) ;;
            *)
              echo "Unsupported repository guardrail strictness" >&2
              exit 1
              ;;
          esac

          IFS=',' read -r -a selected_surfaces <<< "$surfaces"
          [[ "${#selected_surfaces[@]}" -gt 0 ]]
          seen=,
          has_core=0
          for surface in "${selected_surfaces[@]}"; do
            case "$surface" in
              core|intent|tasks|outcomes|planning|status|issues|projects|review|ci) ;;
              *)
                echo "Unknown repository guardrail surface" >&2
                exit 1
                ;;
            esac
            if [[ "$seen" == *",${surface},"* ]]; then
              echo "Duplicate repository guardrail surface" >&2
              exit 1
            fi
            seen="${seen}${surface},"
            [[ "$surface" == core ]] && has_core=1
          done
          if [[ "$has_core" != 1 ]]; then
            echo "The core repository guardrail surface is required" >&2
            exit 1
          fi

          surface_selected() {
            [[ "$seen" == *",${1},"* ]]
          }

          require_selected_file() {
            local surface="$1"
            local path="$2"
            if surface_selected "$surface" && { [[ ! -f "$path" ]] || [[ -L "$path" ]]; }; then
              echo "Selected ${surface} guardrail surface is missing its local authority at ${path}" >&2
              exit 1
            fi
          }

          require_selected_file intent docs/prompts.md
          require_selected_file tasks TASKS.md
          require_selected_file outcomes CHANGELOG.md
          require_selected_file planning PLAN.md
          require_selected_file status PROJECT_STATUS.md
          require_selected_file issues .github/ISSUE_TEMPLATE/work-item.yml
          require_selected_file review .github/pull_request_template.md
          require_selected_file ci .github/workflows/guardrails-audit.yml

          if surface_selected projects && [[ "$project_authority" == disabled ]]; then
            echo "The projects surface cannot be selected while Project authority is disabled" >&2
            exit 1
          fi
